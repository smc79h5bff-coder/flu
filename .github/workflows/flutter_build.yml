name: Flutter APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (prod)
        run: flutter build apk --release --flavor prod

      - name: Build APK (coexist)
        run: flutter build apk --release --flavor coexist

      - name: Upload prod APK
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release
          path: build/app/outputs/flutter-apk/app-prod-release.apk

      - name: Upload coexist APK
        uses: actions/upload-artifact@v4
        with:
          name: app-coexist-release
          path: build/app/outputs/flutter-apk/app-coexist-release.apk
