name: 构建发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号，比如 v1.0.0'
        required: true
        default: 'v1.0.0'
      branch:
        description: '要构建的分支'
        required: true
        default: 'kuai_chonggou_man'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 准备签名（首次自动生成并保存）
        run: |
          if [ ! -f android/app/release.jks ]; then
            keytool -genkeypair -v \
              -keystore android/app/release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias docdiff -storepass 123456 -keypass 123456 \
              -dname "CN=DocDiff"
            git config user.name "actions"
            git config user.email "actions@github.com"
            git add -f android/app/release.jks
            git commit -m "加入签名文件 [skip ci]"
            git push origin HEAD:${{ github.event.inputs.branch }}
          fi

      - run: flutter pub get
      - run: flutter build apk --release --flavor prod --target-platform android-arm64
      - run: flutter build apk --release --flavor coexist --target-platform android-arm64

      - name: 整理
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-prod-release.apk "out/TxTdiff.apk"
          cp build/app/outputs/flutter-apk/app-coexist-release.apk "out/TXT对比.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          body: |
            - TxTdiff.apk
            - TXT对比.apk
          files: out/*.apk
