name: docdiff
description: Mobile lightweight document diff tool.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # File picker + cloud
  file_picker: ^13.1.0

  # Document parsing
  archive: ^3.4.0      # zip decode for OOXML (.docx) container
  xml: ^6.3.0          # parse word/document.xml
  # pdfrx: ^1.0.0       # pdf rendering (P1)

  # OCR (P1)
  # google_mlkit_text_recognition: ^0.11.0

  # Diff core
  diff_match_patch: ^0.4.1
  
  # Utils
  path: ^1.8.3
  collection: ^1.18.0
  url_launcher: ^6.2.1
  gbk_codec: ^0.4.0
  enough_convert: ^1.6.0
  charset: ^2.0.1
  crypto: ^3.0.0      # MD5 对比

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
